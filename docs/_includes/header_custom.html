<div class="theme-toggle-wrap">
  <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Toggle Theme" title="Toggle Light / Dark Mode">
    <span class="theme-icon-light">☀️</span>
    <span class="theme-icon-dark">🌙</span>
  </button>
</div>

<script>
  (function () {
    var toggleBtn = document.getElementById('theme-toggle-btn');
    var saved = localStorage.getItem('theme');
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    var currentTheme = saved || (prefersDark ? 'dark' : 'light');

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-color-scheme', theme);
      document.body.classList.toggle('dark-mode', theme === 'dark');
      localStorage.setItem('theme', theme);
    }

    applyTheme(currentTheme);

    if (toggleBtn) {
      toggleBtn.addEventListener('click', function () {
        var next = document.documentElement.getAttribute('data-color-scheme') === 'dark' ? 'light' : 'dark';
        applyTheme(next);
      });
    }

    /* Move the toggle to be exactly after the GitHub button */
    window.addEventListener('DOMContentLoaded', function() {
      var auxList = document.querySelector('.aux-nav-list');
      var toggleWrap = document.querySelector('.theme-toggle-wrap');
      if (auxList && toggleWrap) {
        var li = document.createElement('li');
        li.className = 'aux-nav-list-item';
        li.appendChild(toggleWrap);
        auxList.appendChild(li);
      }
    });
  })();
</script>
