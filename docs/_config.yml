    color: green

plugins:
  - jekyll-remote-theme

aux_links:
  "GitHub": "https://github.com/ADORSYS-GIS/wazuh-agent-status"

exclude:
  - architecture
  - roadmap.md
  - rust-migration-technical-proposal.md
