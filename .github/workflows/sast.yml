name: Static Application Security Testing (SAST)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sbom:
    uses: ADORSYS-GIS/adorsys-ci-cd-templates/.github/workflows/sbom.yml@17fe8c106fcac2a4b6ac1992cd1b89166f0eb5e2
    with:
      runner: ubuntu-latest
      working-directory: "."
    permissions:
      contents: read

  sast-rust:
    uses: ADORSYS-GIS/adorsys-ci-cd-templates/.github/workflows/sast-rust.yml@6a07b60f35e2b595385500be57330e3eb178e706
    with:
      runner: ubuntu-latest
      working-directory: "wazuh-agent-status-rust-server"
      rust-version: "stable"
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write # Required by reviewdog to post review annotations/comments to the pull request
      statuses: write # Required to update commit/PR status checks upon workflow completion

  sast-rust-client:
    uses: ADORSYS-GIS/adorsys-ci-cd-templates/.github/workflows/sast-rust.yml@6a07b60f35e2b595385500be57330e3eb178e706
    with:
      runner: ubuntu-latest
      working-directory: "wazuh-agent-status-rust-client/src-tauri"
      rust-version: "stable"
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write # Required by reviewdog to post review annotations/comments to the pull request
      statuses: write # Required to update commit/PR status checks upon workflow completion

  sast-javascript-typescript:
    uses: ADORSYS-GIS/adorsys-ci-cd-templates/.github/workflows/sast-javascript-typescript.yml@6a07b60f35e2b595385500be57330e3eb178e706
    with:
      runner: ubuntu-latest
      working-directory: "."
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write # Required by reviewdog to post review annotations/comments to the pull request
      statuses: write # Required to update commit/PR status checks upon workflow completion

  sast-shell:
    uses: ADORSYS-GIS/adorsys-ci-cd-templates/.github/workflows/sast-shell.yml@6a07b60f35e2b595385500be57330e3eb178e706
    with:
      runner: ubuntu-latest
      working-directory: "."
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write # Required by reviewdog to post review annotations/comments to the pull request
      statuses: write # Required to update commit/PR status checks upon workflow completion

  sast-powershell:
    uses: ADORSYS-GIS/adorsys-ci-cd-templates/.github/workflows/sast-powershell.yml@6a07b60f35e2b595385500be57330e3eb178e706
    with:
      runner: ubuntu-latest
      working-directory: "."
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write # Required by reviewdog to post review annotations/comments to the pull request
      statuses: write # Required to update commit/PR status checks upon workflow completion

