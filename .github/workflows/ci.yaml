name: Wazuh Agent Status - Rust Components CI

on:
  pull_request:
    paths:
      - "wazuh-agent-status-rust-server/**"
      - "wazuh-agent-status-rust-client/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI - ${{ matrix.component.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - { dir: "wazuh-agent-status-rust-server", name: "Server" }
          - { dir: "wazuh-agent-status-rust-client", name: "Client" }

    defaults:
      run:
        working-directory: ./${{ matrix.component.dir }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d1915638f7e18cd4854ef7de212e79b3 # v4.1.7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-action@b8714d8bfae3bee53527f5f7b0754b4c093d6393 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Tauri system dependencies (Client only)
        if: matrix.component.name == 'Client'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libssl-dev \
            libxdo-dev

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@82a82a6a0c4ac1b525331a01d34d632b295e8ae4 # v2.7.0
        with:
          workspaces: ${{ matrix.component.dir }}

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run Clippy linter
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Run dependency audit
        run: |
          cargo install cargo-audit
          cargo audit
