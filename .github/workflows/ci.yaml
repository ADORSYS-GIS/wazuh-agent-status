name: Wazuh Agent Status - Rust Components CI

on: [pull_request]

jobs:
  setup:
    name: Setup Rust Toolchain
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Install stable Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          components: rustfmt, clippy

  cargo-fmt:
    name: Cargo Format Check - ${{ matrix.component.name }}
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        component:
          - { dir: "wazuh-agent-status-rust-server", name: "Server" }
          - { dir: "wazuh-agent-status-rust-client/src-tauri", name: "Client" }
    defaults:
      run:
        working-directory: ./${{ matrix.component.dir }}
    steps:
      - name: Fetch Repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Install stable Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          components: rustfmt, clippy

      - name: Rustfmt Check
        run: cargo fmt --all || true

  cargo-build:
    name: Cargo Build - ${{ matrix.component.name }}
    runs-on: ubuntu-latest
    needs: cargo-fmt
    strategy:
      fail-fast: false
      matrix:
        component:
          - { dir: "wazuh-agent-status-rust-server", name: "Server" }
          - { dir: "wazuh-agent-status-rust-client/src-tauri", name: "Client" }
    defaults:
      run:
        working-directory: ./${{ matrix.component.dir }}
    steps:
      - name: Fetch Repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Install stable Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          components: rustfmt, clippy

      - name: Install Tauri system dependencies (Client only)
        if: matrix.component.name == 'Client'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libssl-dev \
            libxdo-dev

      - name: Cargo Build
        run: cargo build --workspace --all-targets --all-features

  cargo-clippy:
    name: Cargo Clippy Check - ${{ matrix.component.name }}
    runs-on: ubuntu-latest
    needs: cargo-build
    strategy:
      fail-fast: false
      matrix:
        component:
          - { dir: "wazuh-agent-status-rust-server", name: "Server" }
          - { dir: "wazuh-agent-status-rust-client/src-tauri", name: "Client" }
    defaults:
      run:
        working-directory: ./${{ matrix.component.dir }}
    steps:
      - name: Fetch Repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Install stable Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          components: rustfmt, clippy

      - name: Install Tauri system dependencies (Client only)
        if: matrix.component.name == 'Client'
        run: |
          sudo apt-get update
          sudo apt-get install -y \r
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libssl-dev \
            libxdo-dev

      - name: Clippy Check
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  cargo-nextest:
    name: Cargo Nextest - ${{ matrix.component.name }}
    runs-on: ubuntu-latest
    needs: cargo-build
    strategy:
      fail-fast: false
      matrix:
        component:
          - { dir: "wazuh-agent-status-rust-server", name: "Server" }
          - { dir: "wazuh-agent-status-rust-client/src-tauri", name: "Client" }
    defaults:
      run:
        working-directory: ./${{ matrix.component.dir }}
    steps:
      - name: Fetch Repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Install stable Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1

      - name: Install Tauri system dependencies (Client only)
        if: matrix.component.name == 'Client'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libssl-dev \
            libxdo-dev

      - name: Install cargo-nextest
        uses: taiki-e/install-action@b550161ef8a7bc4f2a671c0b03a18ac9ccedea1e # v2
        with:
          tool: nextest

      - name: Run Cargo Tests
        run: cargo nextest run --workspace --all-targets --all-features

  cargo-machete:
    name: Cargo Machete Check - ${{ matrix.component.name }}
    runs-on: ubuntu-latest
    needs: cargo-build
    strategy:
      fail-fast: false
      matrix:
        component:
          - { dir: "wazuh-agent-status-rust-server", name: "Server" }
          - { dir: "wazuh-agent-status-rust-client/src-tauri", name: "Client" }
    defaults:
      run:
        working-directory: ./${{ matrix.component.dir }}
    steps:
      - name: Fetch Repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Install stable Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1

      - name: Check for unused dependencies
        uses: taiki-e/install-action@b550161ef8a7bc4f2a671c0b03a18ac9ccedea1e # v2
        with:
          tool: cargo-machete

      - name: Cargo Machete
        run: cargo machete --with-metadata
