name: Build and Release Binaries for Linux (amd64), macOS (AMD64, ARM64)

on:
  push:
    tags:
      - 'v*'

env:
  SERVER_DIR: wazuh-agent-status-rust-server
  CLIENT_DIR: wazuh-agent-status-rust-client
  CLIENT_APP_NAME: wazuh-agent-status-client
  SERVER_APP_NAME: wazuh-agent-status

jobs:
  build-linux:
    name: Build for Linux AMD64
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set version
        id: set_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          fi

      - name: Bump versions
        shell: bash
        run: |
          RAW_VERSION=${GITHUB_REF#refs/tags/v}
          sed "s/^version = .*/version = \"$RAW_VERSION\"/" ${{ env.SERVER_DIR }}/Cargo.toml > temp_server.toml && mv temp_server.toml ${{ env.SERVER_DIR }}/Cargo.toml
          sed "s/^version = .*/version = \"$RAW_VERSION\"/" ${{ env.CLIENT_DIR }}/src-tauri/Cargo.toml > temp_client.toml && mv temp_client.toml ${{ env.CLIENT_DIR }}/src-tauri/Cargo.toml
          jq --arg v "$RAW_VERSION" '.version = $v' ${{ env.CLIENT_DIR }}/package.json > temp_pkg.json && mv temp_pkg.json ${{ env.CLIENT_DIR }}/package.json
          jq --arg v "$RAW_VERSION" '.version = $v' ${{ env.CLIENT_DIR }}/src-tauri/tauri.conf.json > temp_tauri.json && mv temp_tauri.json ${{ env.CLIENT_DIR }}/src-tauri/tauri.conf.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: ${{ env.CLIENT_DIR }}/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            ${{ env.SERVER_DIR }}
            ${{ env.CLIENT_DIR }}/src-tauri
          key: rust-release-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            musl-tools \
            fuse \
            libfuse2
          sudo modprobe fuse
          sudo chmod 666 /dev/fuse
          sudo chown root:$(id -gn) /dev/fuse

      - name: Build Rust Server
        run: |
          cd ${{ env.SERVER_DIR }}
          cargo build --release --target ${{ matrix.target }}
          mkdir -p ../dist
          cp target/${{ matrix.target }}/release/wazuh-agent-status-rust-server ../dist/${{ env.SERVER_APP_NAME }}-linux-${{ matrix.arch }}

      - name: Configure Gateway URL from Secrets
        shell: bash
        env:
          GATEWAY_URL_DEV: ${{ secrets.WAZUH_GATEWAY_URL_DEV }}
          GATEWAY_URL_PROD: ${{ secrets.WAZUH_GATEWAY_URL_PROD }}
        run: |
          if [[ "${{ github.ref_name }}" == *"rc"* ]]; then
            GATEWAY_URL="${GATEWAY_URL_DEV}"
          else
            GATEWAY_URL="${GATEWAY_URL_PROD}"
          fi

          if [[ -z "$GATEWAY_URL" ]]; then
            echo "Error: WAZUH_GATEWAY_URL secret is not set!"
            exit 1
          else
            echo "Configuring gateway_url..."
            CONFIG_FILE="${{ env.CLIENT_DIR }}/src-tauri/app_config.json"
            jq --arg url "$GATEWAY_URL" '.gateway_url = $url' "$CONFIG_FILE" > temp.json && mv temp.json "$CONFIG_FILE"
          fi

      - name: Build Tauri Client (Tray App)
        run: |
          cd ${{ env.CLIENT_DIR }}
          export RUST_BACKTRACE=1
          export TAURI_DEBUG=1
          npm install
          npm run tauri build -- --bundles deb,rpm
          cp src-tauri/target/release/wazuh-agent-status ../dist/${{ env.CLIENT_APP_NAME }}-linux-${{ matrix.arch }}
          cp src-tauri/icons/icon.png ../dist/icon.png

      - name: Upload Linux client binaries
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.CLIENT_APP_NAME }}-linux-${{ matrix.arch }}
          path: |
            dist/${{ env.CLIENT_APP_NAME }}-linux-${{ matrix.arch }}
            dist/icon.png

      - name: Upload Linux server binaries
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.SERVER_APP_NAME }}-linux-${{ matrix.arch }}
          path: dist/${{ env.SERVER_APP_NAME }}-linux-${{ matrix.arch }}

  build-macos:
    name: Build for macOS (${{ matrix.arch }})
    # Using self-hosted runners due to billing issues with GitHub-hosted macOS runners.
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-apple-darwin
            runner: [self-hosted, wazuh]
          - arch: arm64
            target: aarch64-apple-darwin
            runner: [self-hosted, dip-dev-wazuh-help]
          # old approach: GitHub-hosted runners were selected via the os field below
          # - os: macos-14-large
          #   arch: amd64
          # - os: macos-latest
          #   arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set version
        id: set_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          fi

      - name: Bump versions
        shell: bash
        run: |
          RAW_VERSION=${GITHUB_REF#refs/tags/v}
          sed "s/^version = .*/version = \"$RAW_VERSION\"/" ${{ env.SERVER_DIR }}/Cargo.toml > temp_server.toml && mv temp_server.toml ${{ env.SERVER_DIR }}/Cargo.toml
          sed "s/^version = .*/version = \"$RAW_VERSION\"/" ${{ env.CLIENT_DIR }}/src-tauri/Cargo.toml > temp_client.toml && mv temp_client.toml ${{ env.CLIENT_DIR }}/src-tauri/Cargo.toml
          jq --arg v "$RAW_VERSION" '.version = $v' ${{ env.CLIENT_DIR }}/package.json > temp_pkg.json && mv temp_pkg.json ${{ env.CLIENT_DIR }}/package.json
          jq --arg v "$RAW_VERSION" '.version = $v' ${{ env.CLIENT_DIR }}/src-tauri/tauri.conf.json > temp_tauri.json && mv temp_tauri.json ${{ env.CLIENT_DIR }}/src-tauri/tauri.conf.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: ${{ env.CLIENT_DIR }}/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            ${{ env.SERVER_DIR }}
            ${{ env.CLIENT_DIR }}/src-tauri
          key: rust-release-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Rust Server
        run: |
          cd ${{ env.SERVER_DIR }}
          cargo build --release --target ${{ matrix.target }}
          mkdir -p ../dist
          cp target/${{ matrix.target }}/release/wazuh-agent-status-rust-server ../dist/${{ env.SERVER_APP_NAME }}-darwin-${{ matrix.arch }}

      - name: Configure Gateway URL from Secrets
        shell: bash
        env:
          GATEWAY_URL_DEV: ${{ secrets.WAZUH_GATEWAY_URL_DEV }}
          GATEWAY_URL_PROD: ${{ secrets.WAZUH_GATEWAY_URL_PROD }}
        run: |
          if [[ "${{ github.ref_name }}" == *"rc"* ]]; then
            GATEWAY_URL="${GATEWAY_URL_DEV}"
          else
            GATEWAY_URL="${GATEWAY_URL_PROD}"
          fi

          if [[ -z "$GATEWAY_URL" ]]; then
            echo "Error: WAZUH_GATEWAY_URL secret is not set!"
            exit 1
          else
            echo "Configuring gateway_url..."
            CONFIG_FILE="${{ env.CLIENT_DIR }}/src-tauri/app_config.json"
            jq --arg url "$GATEWAY_URL" '.gateway_url = $url' "$CONFIG_FILE" > temp.json && mv temp.json "$CONFIG_FILE"
          fi

      - name: Build Tauri Client (Tray App)
        run: |
          cd ${{ env.CLIENT_DIR }}
          npm install
          npm run tauri build -- --target ${{ matrix.target }}
          cp src-tauri/target/${{ matrix.target }}/release/wazuh-agent-status ../dist/${{ env.CLIENT_APP_NAME }}-darwin-${{ matrix.arch }}

      - name: Upload MacOS client binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.CLIENT_APP_NAME }}-darwin-${{ matrix.arch }}
          path: dist/${{ env.CLIENT_APP_NAME }}-darwin-${{ matrix.arch }}

      - name: Upload MacOS server binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.SERVER_APP_NAME }}-darwin-${{ matrix.arch }}
          path: dist/${{ env.SERVER_APP_NAME }}-darwin-${{ matrix.arch }}

  build-windows:
    name: Build for Windows AMD64
    runs-on: windows-latest
    # No --target flag on Windows: openssl-sys fails to build OpenSSL from source
    # when an explicit target is set. The default host target works correctly.
    strategy:
      matrix:
        arch: [amd64]

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set version
        id: set_version
        shell: bash
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          fi

      - name: Bump versions
        shell: bash
        run: |
          RAW_VERSION=${GITHUB_REF#refs/tags/v}
          sed "s/^version = .*/version = \"$RAW_VERSION\"/" ${{ env.SERVER_DIR }}/Cargo.toml > temp_server.toml && mv temp_server.toml ${{ env.SERVER_DIR }}/Cargo.toml
          sed "s/^version = .*/version = \"$RAW_VERSION\"/" ${{ env.CLIENT_DIR }}/src-tauri/Cargo.toml > temp_client.toml && mv temp_client.toml ${{ env.CLIENT_DIR }}/src-tauri/Cargo.toml
          jq --arg v "$RAW_VERSION" '.version = $v' ${{ env.CLIENT_DIR }}/package.json > temp_pkg.json && mv temp_pkg.json ${{ env.CLIENT_DIR }}/package.json
          jq --arg v "$RAW_VERSION" '.version = $v' ${{ env.CLIENT_DIR }}/src-tauri/tauri.conf.json > temp_tauri.json && mv temp_tauri.json ${{ env.CLIENT_DIR }}/src-tauri/tauri.conf.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable

      - name: Build Rust Server
        shell: cmd
        run: |
          cd ${{ env.SERVER_DIR }}
          cargo build --release
          if not exist ..\dist mkdir ..\dist
          copy target\release\wazuh-agent-status-rust-server.exe ..\dist\${{ env.SERVER_APP_NAME }}-windows-${{ matrix.arch }}.exe

      - name: Configure Gateway URL from Secrets
        shell: bash
        env:
          GATEWAY_URL_DEV: ${{ secrets.WAZUH_GATEWAY_URL_DEV }}
          GATEWAY_URL_PROD: ${{ secrets.WAZUH_GATEWAY_URL_PROD }}
        run: |
          if [[ "${{ github.ref_name }}" == *"rc"* ]]; then
            GATEWAY_URL="${GATEWAY_URL_DEV}"
          else
            GATEWAY_URL="${GATEWAY_URL_PROD}"
          fi

          if [[ -z "$GATEWAY_URL" ]]; then
            echo "Error: WAZUH_GATEWAY_URL secret is not set!"
            exit 1
          else
            echo "Configuring gateway_url..."
            CONFIG_FILE="${{ env.CLIENT_DIR }}/src-tauri/app_config.json"
            jq --arg url "$GATEWAY_URL" '.gateway_url = $url' "$CONFIG_FILE" > temp.json && mv temp.json "$CONFIG_FILE"
          fi

      - name: Build Tauri Client (Tray App)
        shell: bash
        run: |
          cd ${{ env.CLIENT_DIR }}
          npm install
          npm run tauri build
          cp src-tauri/target/release/wazuh-agent-status.exe ../dist/${{ env.CLIENT_APP_NAME }}-windows-${{ matrix.arch }}.exe

      - name: Upload windows client binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.CLIENT_APP_NAME }}-windows-${{ matrix.arch }}
          path: dist/${{ env.CLIENT_APP_NAME }}-windows-${{ matrix.arch }}.exe

      - name: Upload windows server binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.SERVER_APP_NAME }}-windows-${{ matrix.arch }}
          path: dist/${{ env.SERVER_APP_NAME }}-windows-${{ matrix.arch }}.exe

  update-changelog-and-checksums:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    needs:
      - build-linux
      - build-macos
      - build-windows

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: "0"
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist/
          merge-multiple: true

      - name: Configure git user
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Generate checksums
        run: |
          find dist -maxdepth 1 -type f -exec sha256sum {} + | sed 's|  dist/|  |' > checksums.sha256
          find scripts -type f -exec sha256sum {} + >> checksums.sha256
          cat checksums.sha256

      - name: Generate full CHANGELOG.md
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5  # v4.8.0
        with:
          config: cliff.toml
          args: --output CHANGELOG.md

      - name: Bump versions
        shell: bash
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            RAW_VERSION=${GITHUB_REF#refs/tags/v}
            sed "s/^version = .*/version = \"$RAW_VERSION\"/" ${{ env.SERVER_DIR }}/Cargo.toml > temp_server.toml && mv temp_server.toml ${{ env.SERVER_DIR }}/Cargo.toml
            sed "s/^version = .*/version = \"$RAW_VERSION\"/" ${{ env.CLIENT_DIR }}/src-tauri/Cargo.toml > temp_client.toml && mv temp_client.toml ${{ env.CLIENT_DIR }}/src-tauri/Cargo.toml
            jq --arg v "$RAW_VERSION" '.version = $v' ${{ env.CLIENT_DIR }}/package.json > temp_pkg.json && mv temp_pkg.json ${{ env.CLIENT_DIR }}/package.json
            jq --arg v "$RAW_VERSION" '.version = $v' ${{ env.CLIENT_DIR }}/src-tauri/tauri.conf.json > temp_tauri.json && mv temp_tauri.json ${{ env.CLIENT_DIR }}/src-tauri/tauri.conf.json
          fi

      - name: Commit and push changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git add CHANGELOG.md checksums.sha256 ${{ env.SERVER_DIR }}/Cargo.toml ${{ env.CLIENT_DIR }}/src-tauri/Cargo.toml ${{ env.CLIENT_DIR }}/package.json ${{ env.CLIENT_DIR }}/src-tauri/tauri.conf.json
            git commit -m "docs: update CHANGELOG.md, checksums, and app version [skip ci]"
            git push origin ${{ github.head_ref || github.ref_name }}
          else
            echo "No changes to commit"
          fi

  release:
    name: Release
    permissions:
      contents: write
    needs:
      - update-changelog-and-checksums
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Get the version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist/
          merge-multiple: true

      - name: Generate checksums
        run: |
          find dist -maxdepth 1 -type f -exec sha256sum {} + | sed 's|  dist/|  |' > checksums.sha256
          find scripts -type f -exec sha256sum {} + >> checksums.sha256
          cat checksums.sha256

      - name: Generate release notes (latest only)
        id: git_cliff
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: /tmp/release-notes.md

      - name: Determine prerelease
        id: prerelease
        run: |
          if [[ "${GITHUB_REF#refs/tags/}" == *"rc"* ]]; then
            echo "PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "PRERELEASE=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: |
            dist/*
            checksums.sha256
          body: ${{ steps.git_cliff.outputs.content }}
          prerelease: ${{ steps.prerelease.outputs.PRERELEASE }}
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          draft: false
          make_latest: legacy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
